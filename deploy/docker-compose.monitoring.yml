# Runs ONLY on monitoringLS.
# Backend API only. Metric collection is handled by a cron job on the host that
# runs `python -m app.collect_once` every minute (Celery/Redis removed).
# Usage on the server:
#   docker compose -f docker-compose.monitoring.yml up -d --remove-orphans
services:
  backend:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: always
    ports:
      - "8000:8000"          # reachable by frontendLSEC2 over the private network
    env_file:
      - .env
    volumes:
      - .:/app
      - /home/ubuntu/.ssh:/root/.ssh   # key the cron collector uses to SSH into productionLSEC2

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /metrics {
        proxy_pass http://backend:8000;
    }

    location /trigger {
        proxy_pass http://backend:8000;
    }

    location /api {
        proxy_pass http://backend:8000;
    }
}